<style>

  body { margin:0; display:flex; min-height:100vh;
         background:rgb(var(--mdui-color-surface-container)); color:rgb(var(--mdui-color-on-surface));

    .preview-btn { height:auto; }

    .style-card, .style-card canvas, .style-card .thumb { width:88px; }
    .style-card .thumb { height:191px; }
    #panel { width:auto; flex:none; border-right:0;
             border-top:1px solid rgb(var(--mdui-color-outline-variant)); }
  }
  #previewDialog { max-width:100vw; max-height:100dvh; padding:0; border:0;
                  background:rgb(var(--mdui-color-surface-container-lowest));
                  border-radius:var(--mdui-shape-corner-large); }
  #previewDialog::backdrop { background:rgb(var(--mdui-color-surface-container)); }
  #previewDialog canvas { max-height:100dvh; max-width:100vw; box-shadow:none; }

<body>
<aside id="panel">
  <h1>锁屏文字海报</h1>
  <p class="sub">纯灰阶 · 颗粒字 · 六套版心</p>

  <mdui-text-field id="text" variant="outlined" rows="3" clearable
                   label="文字（可用【】标出关键词）"
                   value="人生代代无穷已，江月年年望相似。"></mdui-text-field>

  <div class="row">
    <mdui-text-field id="title" variant="outlined" clearable label="书名" value="春江花月夜"></mdui-text-field>
    <mdui-text-field id="author" variant="outlined" clearable label="作者" value="张若虚"></mdui-text-field>
  </div>

  <div class="field-block">
    <mdui-text-field id="keyword" variant="outlined" clearable label="关键词（留空 = 自动）"></mdui-text-field>
  </div>

  <div class="field-block">
    <p class="section-label">版式</p>
    <div class="style-wrap">
      <mdui-button-icon class="style-arrow" id="stylePrev" aria-label="上一版式" variant="outlined">
        <mdui-icon><svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></mdui-icon>
      </mdui-button-icon>
      <div class="style-strip" id="styleStrip" role="group" aria-label="版式"></div>
      <mdui-button-icon class="style-arrow" id="styleNext" aria-label="下一版式" variant="outlined">
        <mdui-icon><svg viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg></mdui-icon>
      </mdui-button-icon>
    </div>
    <div id="lunarRow" hidden><mdui-checkbox id="lunarOn">农历（单向历联网查询）</mdui-checkbox></div>
  </div>

  <div class="field-block">
    <mdui-select id="size" variant="outlined" label="壁纸大小" value="0"></mdui-select>
    <div class="hint" id="ratio"></div>
    <div class="row" id="customRow" hidden>
      <mdui-text-field id="cw" variant="outlined" type="number" label="宽" value="1170"></mdui-text-field>
      <mdui-text-field id="ch" variant="outlined" type="number" label="高" value="2532"></mdui-text-field>
    </div>
  </div>

  <div class="field-block">
    <mdui-select id="pos" variant="outlined" label="文字位置" value="center">
      <mdui-menu-item value="center">居中</mdui-menu-item>
      <mdui-menu-item value="tl">左上</mdui-menu-item>
      <mdui-menu-item value="tr">右上</mdui-menu-item>
      <mdui-menu-item value="bl">左下</mdui-menu-item>
      <mdui-menu-item value="br">右下</mdui-menu-item>
    </mdui-select>
  </div>

  <div class="field-block">
    <mdui-text-field id="lineChars" variant="outlined" type="number" label="每行字数（0 = 自动）"
                     value="0"></mdui-text-field>
  </div>

  <div class="btns">
    <mdui-button id="save" variant="filled" full-width>
      下载 PNG
      <mdui-icon slot="icon"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></mdui-icon>
    </mdui-button>
  </div>
  <div id="status" role="status"></div>

  <div id="note">
    灰阶六档（0/34/102/136/200/112）与颗粒算法移植自 book.koplugin/features/lockscreen/typo.lua。<br>
    拼贴与单向历为整页排版，忽略文字位置；竖排版式在横屏画布上自动改用横排。<br>
    单向历日期固定为今天；勾选农历后向 api.530.news 查询农历与节日，失败则只画公历。<br>
    导出按所选像素输出 PNG，不缩放。
  </div>
</aside>

<main>
  <button type="button" class="preview-btn" id="previewBtn" aria-expanded="false"
          aria-controls="previewDialog" aria-label="放大预览海报" aria-describedby="posterAlt">
    <canvas id="poster" aria-hidden="true"></canvas>
  </button>
  <p id="posterAlt" class="visually-hidden"></p>
</main>

<dialog id="previewDialog" aria-label="海报预览" closedby="any">
  <mdui-button-icon class="preview-close" id="previewClose" aria-label="关闭预览" variant="filled">
    <mdui-icon><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></mdui-icon>
  </mdui-button-icon>
</dialog>

<script src="https://unpkg.com/mdui@2.1.5/mdui.global.js"></script>
<script src="typo_words.js"></script>

<script>
(function () {
  'use strict';
  if (window.mdui) mdui.setColorScheme('#6285BC');


  // ===== 常量：灰阶与字体 =====
  var BLACK = 0x00, INK = 0x22, GRAY = 0x66, RULE = 0x88, PALE = 0xC8, SMOKE = 0x70;
  var FONT = '"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif CJK TC",' +
             '"Noto Serif CJK HK","Noto Serif CJK JP","AR PL UMing CN",serif';
  var STYLES = ['horizontal', 'vertical', 'backdrop', 'scatter', 'collage', 'danxiangli'];

  var charsOf = function (s) { return Array.from(s || ''); };
  function fontFor(px, bold) { return (bold ? 'bold ' : 'normal ') + px + 'px ' + FONT; }

  // ===== 测量 =====
  var mctx = document.createElement('canvas').getContext('2d');
  var mcache = new Map();
  function measure(s, px, bold) {
    px = Math.max(6, Math.round(px));
    if (px < 8) return measure(s, 100, bold) * px / 100;
    var key = (bold ? 'b' : 'n') + px + '|' + s;
    var hit = mcache.get(key);
    if (hit !== undefined) return hit;
    mctx.font = fontFor(px, bold);
    var w = mctx.measureText(s).width;
    mcache.set(key, w);
    return w;
  }

  // ===== 文本规则（移植 typo_text.lua）=====
  function setOf(str) { var o = Object.create(null); charsOf(str).forEach(function (c) { o[c] = true; }); return o; }
  var NO_START = setOf('，。、；：！？）》」』】〉〕…—·‧,.;:!?)]}%’”');
  var NO_END = setOf('（《「『【〈〔“‘([{');
  var PUNCT = setOf('，。、；：！？（）《》「」『』【】〈〉〔〕…—·‧,.;:!?()[]{}“”‘’ ');
  var CLAUSE_END = setOf('，。、；：！？…,;:!?');
  var VERTICAL = {
    '，': '︐', '、': '︑', '。': '︒', '：': '︓', '；': '︔', '！': '︕', '？': '︖',
    '…': '︙', '—': '︱', '－': '︲', '（': '︵', '）': '︶', '《': '︽', '》': '︾',
    '〈': '︿', '〉': '﹀', '「': '﹁', '」': '﹂', '『': '﹃', '』': '﹄',
    '【': '︻', '】': '︼', '“': '﹁', '”': '﹂', '‘': '﹃', '’': '﹄',
    '(': '︵', ')': '︶', ',': '︐', '.': '︒', ':': '︓', ';': '︔', '!': '︕', '?': '︖'
  };
  function vertical(ch) { return VERTICAL[ch] || ch; }

  var DICT = null;
  function loadDict() {
    if (DICT) return DICT;
    var d = new Map();
    if (typeof WORDS_TEXT === 'string') {
      var b = null, p = null;
      var lines = WORDS_TEXT.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (/^@[a-z][a-zA-Z]$/.test(line)) {
          b = line.charCodeAt(1) - 97; p = line.charCodeAt(2);
        } else if (b !== null && line && line.charAt(0) !== '#') {
          var ws = line.split(/\s+/);
          for (var j = 0; j < ws.length; j++) if (ws[j]) d.set(ws[j], b * 256 + p);
        }
      }
    }
    return (DICT = d);
  }

  function isHan(ch) { return ch.length === 1 && ch >= '\u4e00' && ch <= '\u9fff'; }

  function segment(text) {
    var d = loadDict(), out = [], run = [];
    function flush() {
      var n = run.length;
      if (!n) return;
      var best = new Array(n + 1), from = new Array(n + 1);
      best[0] = 0;
      for (var i = 1; i <= n; i++) {
        best[i] = best[i - 1] - 24; from[i] = i - 1;
        for (var len = 2; len <= Math.min(4, i); len++) {
          var e = d.get(run.slice(i - len, i).join(''));
          if (e === undefined) continue;
          var bucket = Math.floor(e / 256);
          if (best[i - len] + bucket - 26 > best[i]) {
            best[i] = best[i - len] + bucket - 26; from[i] = i - len;
          }
        }
      }
      var seg = [];
      for (var k = n; k > 0; k = from[k]) seg.unshift(run.slice(from[k], k).join(''));
      out.push.apply(out, seg);
      run = [];
    }
    charsOf(text).forEach(function (ch) {
      if (isHan(ch)) run.push(ch);
      else { flush(); out.push(ch); }
    });
    flush();
    return out;
  }

  function units(text, keep) {
    var out = [], word = null;
    function push(u) {
      if (/^[A-Za-z0-9'\-]$/.test(u)) { word = (word || '') + u; return; }
      if (word !== null) { out.push(word); word = null; }
      if (u !== '\r' && u !== '\t') out.push(u);
    }
    function piece(s) { segment(s).forEach(push); }
    var pos = 0;
    if (keep) {
      while (true) {
        var a = text.indexOf(keep, pos);
        if (a < 0) break;
        piece(text.slice(pos, a));
        if (word !== null) { out.push(word); word = null; }
        out.push(keep);
        pos = a + keep.length;
      }
    }
    piece(text.slice(pos));
    if (word !== null) out.push(word);
    return out;
  }

  var MAXCHARS = 0;
  function setLineChars(n) { MAXCHARS = Math.max(0, Math.min(100, +n || 0)); }

  function breakLines(text, max, measureFn, keep, cap) {
    measureFn = measureFn || function (u) { return charsOf(u).length; };
    var lim = cap === undefined ? MAXCHARS : cap;
    var lines = [], cur = [], used = 0, count = 0;
    function flush() {
      while (cur.length && cur[cur.length - 1] === ' ') cur.pop();
      if (cur.length) lines.push(cur.join(''));
      cur = []; used = 0; count = 0;
    }
    function add(unit, w) { cur.push(unit); used += w; count += charsOf(unit).length; }
    units(text, keep).forEach(function (unit) {
      if (unit === '\n') { flush(); return; }
      if (cur.length === 0 && unit === ' ') return;
      var n = charsOf(unit).length, w = measureFn(unit);
      var hang = NO_START[charsOf(unit)[0]];
      if (!hang && cur.length && (used + w > max || (lim && count + n > lim))) {
        var carry = [];
        while (cur.length > 1 && NO_END[charsOf(cur[cur.length - 1]).pop()]) carry.unshift(cur.pop());
        flush();
        carry.forEach(function (u) { add(u, measureFn(u)); });
      }
      add(unit, w);
    });
    flush();
    return lines;
  }

  function clauses(text) {
    var out = [], cur = [];
    var chars = charsOf(String(text).replace(/[\r\t]/g, ' '));
    function flush() {
      var s = cur.join('').replace(/^\s+/, '').replace(/\s+$/, '');
      if (s !== '') out.push(s);
      cur = [];
    }
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i], nxt = chars[i + 1];
      cur.push(ch);
      if (CLAUSE_END[ch] && !(nxt && (CLAUSE_END[nxt] || NO_START[nxt])) &&
          (charsOf(ch).length > 1 || ch.charCodeAt(0) > 127 || nxt === undefined || nxt === ' ')) flush();
    }
    flush();
    return out;
  }

  var POS = { n: 3, l: 2.5, i: 2.5, s: 1.5, j: 1.5, a: 1.2, v: 1, b: 1, z: 1, t: 1 };
  var STOP = new Set(('就是 一个 什么 没有 可以 这个 那个 我们 你们 他们 自己 已经 因为 所以 但是 如果 还是 只是 不是 这样 那样 ' +
    '怎么 为什么 时候 东西 主义 最好 一切 一种 一样 所有 应该 能够 知道 觉得 需要 成为 发现 找出 出来 起来 之中 之间 ' +
    '以后 以前 现在 永远 总是 真正 彻头彻尾 每个 这些 那些 一些 有些 其实 甚至 或者 而是 非常 比较 不会 不能 开始').split(/\s+/).filter(Boolean));
  var EN_STOP = new Set(('the and that this with from have been were they their there which would could should about ' +
    'into than then them what when where while your yours because being other some such only very just more most ' +
    'better someone something everything nothing').split(' '));
  var MIN_SCORE = 2.5;

  function rankWords(text) {
    var d = loadDict(), segs = segment(text);
    var seen = Object.create(null), best = Object.create(null), at = Object.create(null);
    segs.forEach(function (w) { seen[w] = (seen[w] || 0) + 1; });
    segs.forEach(function (w, i) {
      var e = d.get(w);
      if (e === undefined) return;
      var pos = POS[String.fromCharCode(e % 256)];
      if (!pos || STOP.has(w)) return;
      var b = Math.floor(e / 256);
      var s = pos + (charsOf(w).length === 4 ? 0.3 : 0)
        + Math.min(11, Math.max(0, 16 - b)) * 0.3 - (b < 5 ? (5 - b) * 0.4 : 0)
        + 0.8 * (i + 1) / segs.length + (seen[w] - 1) * 1.5;
      if (best[w] === undefined || s > best[w]) { best[w] = s; at[w] = i + 1; }
    });
    var list = Object.keys(best).map(function (w) { return [w, best[w], at[w]]; });
    if (list.length === 0) {
      (text.match(/[A-Za-z]+/g) || []).forEach(function (w) {
        if (w.length >= 4 && !EN_STOP.has(w.toLowerCase())) list.push([w, MIN_SCORE + w.length * 0.2, list.length]);
      });
    }
    list.sort(function (a, b) { return b[1] - a[1] || a[2] - b[2]; });
    return list;
  }

  function keywordOf(text) {
    var marked = /【(.*?)】/.exec(text);
    if (marked && marked[1] !== '') return marked[1];
    var top = rankWords(text)[0];
    return top && top[1] >= MIN_SCORE ? top[0] : null;
  }

  function topWords(text, n) {
    return rankWords(text).slice(0, n).map(function (it) { return it[0]; });
  }

  function strip(text) { return text.replace(/【/g, '').replace(/】/g, ''); }

  // ===== 绘制指令 =====
  function fmt(n) { return Math.floor(n + 0.5); }

  function textOp(ops, s, x, y, size, gray, bold, grain) {
    ops.push({ t: 'text', s: s, x: fmt(x), y: fmt(y), size: fmt(size),
      gray: gray, bold: !!bold, grain: !!grain });
  }
  function rectOp(ops, x, y, w, h, gray) {
    ops.push({ t: 'rect', x: fmt(x), y: fmt(y), w: Math.max(1, fmt(w)), h: Math.max(1, fmt(h)), gray: gray });
  }
  function attribution(q) {
    var parts = [];
    if (q.title) parts.push(/^《.*》$/.test(q.title) ? q.title : '《' + q.title + '》');
    if (q.author) parts.push(q.author);
    return parts.length ? '—— ' + parts.join(' ') : '';
  }
  function runs(line, kw) {
    var out = [], pos = 0;
    if (kw) {
      while (true) {
        var a = line.indexOf(kw, pos);
        if (a < 0) break;
        if (a > pos) out.push([line.slice(pos, a), false]);
        out.push([kw, true]);
        pos = a + kw.length;
      }
    }
    if (pos < line.length) out.push([line.slice(pos), false]);
    return out;
  }

  // 排版上下文：measure + 行内关键词放大
  function newCtx(measureFn, kw, kscale) {
    var c = { kscale: kscale || 1 };
    var emph = c.kscale > 1 && kw ? kw : null;
    function unitW(u, size, bold) { return measureFn(u, (emph && u === emph) ? size * c.kscale : size, bold); }

      if (hang && NO_START[hang]) sum -= measureFn(hang, size, bold);

    };
    c.big = function (line, size) { return (emph && line.indexOf(emph) >= 0) ? size * c.kscale : size; };
    c.wrap = function (text, width, size, bold) {
      var lines = [];
      clauses(text).forEach(function (cl) {
        breakLines(cl, width, function (u) { return unitW(u, size, bold); }, emph).forEach(function (l) { lines.push(l); });
      });
      return lines;
    };
    c.height = function (lines, size, lh) {
      var h = 0;
      lines.forEach(function (l) { h += c.big(l, size) * lh; });
      return h;
    };
    c.fit = function (text, width, maxSize, minSize, maxH, lh, bold) {
      if (MAXCHARS) maxSize = Math.min(maxSize, width / (MAXCHARS * measureFn('国', 100, bold) / 100));
      var size = maxSize, lines;
      for (var guard = 0; guard < 400; guard++) {
        lines = c.wrap(text, width, size, bold);
        var ok = c.height(lines, size, lh) <= maxH;
        for (var i = 0; ok && i < lines.length; i++) if (c.lineW(lines[i], size, bold) > width) ok = false;
        if (ok || size <= minSize) return { size: fmt(size), lines: lines };
        size = Math.max(minSize, size * 0.95);

      return { size: fmt(size), lines: lines };
    };
    c.draw = function (ops, line, x, y, size, lh, gray, bold) {
      var big = c.big(line, size);
      runs(line, emph).forEach(function (r) {
        var s = r[1] ? size * c.kscale : size;
        textOp(ops, r[0], x, y + (big - s) * 0.88, s, gray, bold);
        x += measureFn(r[0], s, bold);
      });
      return big * lh;
    };
    c.fill = function (line, width, bold) {
      return width / Math.max(1, c.lineW(line, 100, bold)) * 100;
    };

  }

  function giantRow(ops, word, x, y, g, gray) {

  function lineX(lineW, W, halign, m) {

  var LAYOUTS = {};

  LAYOUTS.horizontal = function (q, W, H, measureFn, o) {

    var cs = clauses(body), last = cs[cs.length - 1] || body;

    var kwAt = kw ? body.indexOf(kw, body.length - last.length) : -1;
    if (kw && kwAt >= 0 && kwAt > 0 && charsOf(body.slice(kwAt)).length <= 6) tail = body.slice(kwAt);
    else if (cs.length >= 2) tail = last;

    var rc = clauses(rest);
    var head = rc[0] || body;
    var mid = rc.length > 1 ? rc.slice(1).join('') : null;

    var ts = 0, tlines = [];

      var tr = c.fit(tail, inner, Math.min(W * 0.19, c.fill(tail, inner, true)), W * 0.06, H * 0.3, 1.15, true);

  LAYOUTS.vertical = function (q, W, H, measureFn, o) {

      runs(col, kw).forEach(function (r) { s += count(r[0]); });

    cols.forEach(function (col, i) { maxh = Math.max(maxh, i * stagger + colLen(col) * size * 1.04); });

        var s = r[1] ? size * kscale : size;

  LAYOUTS.backdrop = function (q, W, H, measureFn, o) {
    var ops = [], m = W * 0.1, inner = W - 2 * m;
    var kchars = charsOf(q.keyword), n = Math.max(1, kchars.length);
    var g = Math.min(W * 1.04 / n, W * 0.6, H * 0.38);
    giantRow(ops, q.keyword, (W - n * g) / 2, H - g * 0.9, g, PALE);

    var c = newCtx(measureFn, q.keyword);
    var fr = c.fit(q.body, inner * 0.9, W * 0.11, W * 0.05, H * 0.42, 1.22, true);
    var size = fr.size, lines = fr.lines;
    var ruleH = Math.max(2, W * 0.003), small = W * 0.024;

  function textBox(ops) {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ops.forEach(function (op) {
      if (op.t !== 'text' || op.grain) return;
      x0 = Math.min(x0, op.x); y0 = Math.min(y0, op.y);
      x1 = Math.max(x1, op.x + measure(op.s, op.size, op.bold)); y1 = Math.max(y1, op.y + op.size);

  LAYOUTS.scatter = function (q, W, H, measureFn, o) {
    var ops = [], m = W * 0.1, inner = W - 2 * m;
    var c = newCtx(measureFn, q.keyword);
    var fr = c.fit(q.body, inner * 0.64, W * 0.085, W * 0.045, H * 0.4, 1.32, true);
    var size = fr.size, lines = fr.lines, lh = 1.32;

    var y = blockY(c.height(lines, size, lh) + capH, H, o.vpos, m);
    for (var i = 1; i <= lines.length; i++) {
      var l = lines[i - 1];
      if (i > 1 && i % 2 === 1 && lines.length > 3) y += size * 0.4;
      y += c.draw(ops, l, lineX(c.lineW(l, size, true), W, o.halign, m), y, size, lh, BLACK, true);
    }

      y += size * 0.3;

    }

    var tb = textBox(ops);
    var gap = W * 0.03, pad = W * 0.03;
    var blocked = [[tb[0] - gap, tb[1] - gap, tb[2] + gap, tb[3] + gap]];
    var slots = [
      function (ww, g) { return [pad, H - pad - g]; },
      function (ww, g) { return [W - pad - ww, (tb[1] + tb[3] - g) / 2]; },
      function (ww, g) { return [W - pad - ww, pad]; },
      function (ww, g) { return [W - pad - ww, H - pad - g]; },
      function (ww, g) { return [pad, pad]; }

      var n = charsOf(word).length;

  function dayOfYear(d) {

  LAYOUTS.collage = function (q, W, H, measureFn) {
    var ops = [], m = W * 0.065, inner = W - 2 * m, small = W * 0.022;
    var leftW = inner * 0.6, rx = m + leftW + inner * 0.05, rightW = W - m - rx;

    textOp(ops, 'NO.' + ('00' + doy).slice(-3), m, m, small, INK, false);
    textOp(ops, d, W - m - measure(d, small, false), m, small, INK, false);
    var y = m + small * 1.9;
    rectOp(ops, m, y, inner, Math.max(2, W * 0.003), BLACK);
    y += W * 0.035;
    var top = y;

    var who = q.author || q.title;
    var plain = newCtx(measureFn);

      textOp(ops, who, m, y, ws, SMOKE, true, true);

  // ===== 单向历（移植 danxiangli.lua）=====

    dxSpacedText(ops, en, cx - dxSpaced(en, small) / 2, y, small, D_INK);
    y += small * 2;
    dxCentered(ops, c.week_zh, cx, y, small * 1.5, BLACK, true);
    y += small * 2.6;
    rectOp(ops, cx - bw * 0.18, y, bw * 0.36, 1, D_GRAY);
    y += small * 1.6;
    if (c.lunar) {
      var ls = small * 2.1;
      dxCentered(ops, c.lunar.date, cx, y, ls, BLACK, true);
      y += ls * 1.45;
      if (c.lunar.ganzhi) {
        dxCentered(ops, c.lunar.ganzhi, cx, y, small * 1.25, D_INK, false);
        y += small * 1.25 * 1.6;
      }
      if (c.lunar.term) {
        dxCentered(ops, c.lunar.term, cx, y, small * 1.25, D_INK, false);
        y += small * 1.25 * 1.4;
      }
    }
    return y;
  }

  function dxQuoteBlock(ops, q, x, width, top, bottom, base) {
    var att = attribution(q);
    var as = base * 0.62;
    var avail = bottom - top - (att ? as * 2.4 : 0);
    var f = dxFitQuote(strip(q.text), width, base, base * 0.6, avail, 1.7);
    var block = f.lines.length * f.size * 1.7 + (att ? as * 2.4 : 0);
    var y = top + Math.max(0, (bottom - top - block) / 2);
    f.lines.forEach(function (line) {
      textOp(ops, line, x, y, f.size, BLACK, false);
      y += f.size * 1.7;
    });
    if (att) {
      y += as * 0.8;
      textOp(ops, att, Math.max(x, x + width - measure(att, as, false)), y, as, D_GRAY, false);
    }
  }

  LAYOUTS.danxiangli = function (q, W, H, measureFn, c) {
    var ops = [], m = Math.min(W, H) * 0.08, small = Math.min(W, H) * 0.024;

    // 刊头：YYYY.MM / 横线
    var right = c.year + '.' + ('0' + c.month).slice(-2);
    textOp(ops, right, W - m - measure(right, small, false), m, small, D_INK, false);
    var top = m + small * 1.8;
    rectOp(ops, m, top, W - m * 2, Math.max(2, small * 0.12), BLACK);

    // 页脚：细线 / 日序
    var fy = H - m - small;
    rectOp(ops, m, fy - small * 0.9, W - m * 2, 1, D_GRAY);
    var tail = 'NO.' + ('00' + c.yday).slice(-3) + ' / ' + c.total;
    textOp(ops, tail, W - m - measure(tail, small, false), fy, small, D_GRAY, false);

    var bottom = H - m - small * 2.2;
    if (W > H) {
      var lw = (W - m * 2) * 0.42;
      var big = Math.min(lw * 0.8, (bottom - top - small * 2) / 2.5);
      dxDateBlock(ops, c, m, lw, top + Math.max(small, (bottom - top - big * 2.45) / 2), big);
      var rx = m + lw + (W - m * 2) * 0.06;
      rectOp(ops, m + lw + (W - m * 2) * 0.03, top + small * 2, 1, bottom - top - small * 4, D_GRAY);
      dxQuoteBlock(ops, q, rx, W - m - rx, top + small * 2, bottom - small, Math.min(W, H) * 0.042);
    } else {
      var inner = W - m * 2;
      var pbig = Math.min(inner * 0.62, (bottom - top) * 0.3);
      var y = dxDateBlock(ops, c, m, inner, top + small * 1.5, pbig);
      rectOp(ops, m, y + small * 0.6, inner, 1, BLACK);
      rectOp(ops, m, y + small * 0.6 + 4, inner, 1, BLACK);
      dxQuoteBlock(ops, q, m + inner * 0.04, inner * 0.92, y + small * 2.4, bottom - small, W * 0.044);
    }
    return ops;
  };
  function maxBottom(ops) {
    var bottom = 0;
    ops.forEach(function (op) {
      if (op.t === 'text' && op.grain) return; // giant decorative words bleed off the edge on purpose
      bottom = Math.max(bottom, op.y + (op.t === 'text' ? op.size : op.h));
    });
    return bottom;
  }

  // ===== 计划：从文字到绘制指令 =====
  function plan(style, q, W, H, opts) {
    var body = strip(q.text);
    var kw = q.keyword || keywordOf(q.text);
    if (kw && body.indexOf(kw) < 0) kw = null;
    var p = { body: body, title: q.title || '', author: q.author || '', keyword: kw };

    if (style === 'danxiangli') {
      var c = dxDay(opts.date || new Date());
      c.lunar = opts.lunar || null;
      var dq = body.trim() ? { text: body, title: p.title, author: p.author } : dxFallback(c);
      var dops = LAYOUTS.danxiangli(dq, W, H, measure, c);
      return { style: style, ops: dops, overflow: maxBottom(dops) > H };
    }

    if (style === 'backdrop' && !kw) style = 'horizontal';
    if (style === 'vertical' && !/[\u4e00-\u9fff]/.test(body)) style = 'horizontal';
    if (style === 'vertical' && W > H) style = 'horizontal';
    if (style === 'scatter') {
      p.words = [];
      if (kw) p.words.push(kw);
      topWords(body, 4).forEach(function (w) { if (p.words.length < 3 && w !== kw) p.words.push(w); });
      if (!kw) style = 'horizontal';
    }
    var ops = LAYOUTS[style](p, W, H, measure, opts);
    return { style: style, ops: ops, overflow: maxBottom(ops) > H };
  }

  // ===== 颗粒 =====
  function noise(x, y) {
    var n = (Math.imul(x, 374761393) ^ Math.imul(y, 668265263)) >>> 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177) >>> 0;
    return ((n ^ (n >>> 16)) & 0xFFFF) / 0xFFFF;
  }

  function paintGrain(ctx, op) {
    var size = op.size, bold = op.bold;
    var tw = Math.ceil(measure(op.s, size, bold)) + 4;
    var th = Math.ceil(size * 1.25);
    if (tw <= 0 || th <= 0) return;

    var tmp = document.createElement('canvas');
    tmp.width = tw; tmp.height = th;
    var tctx = tmp.getContext('2d');
    tctx.fillStyle = '#fff';
    tctx.fillRect(0, 0, tw, th);
    tctx.fillStyle = '#000';
    tctx.textBaseline = 'alphabetic';
    tctx.font = fontFor(size, bold);
    tctx.fillText(op.s, 0, size * 0.88);

    var src = tctx.getImageData(0, 0, tw, th).data;
    var out = tctx.createImageData(tw, th);
    var dst = out.data;
    var depth = 255 - op.gray;
    // shortcut: glyphs over 3MP get 2px grain blocks; tighten if the coarser grain ever shows
    var step = tw * th > 3e6 ? 2 : 1;
    for (var y = 0; y < th; y += step) {
      for (var x = 0; x < tw; x += step) {
        var si = (y * tw + x) * 4;
        var cov = 255 - src[si];
        if (cov <= 8) continue;
        var coarse = noise(Math.floor(x / 5), Math.floor(y / 5));
        var fine = noise(x, y);
        var k = 0.78 + coarse * 0.32 + (fine - 0.5) * 0.28;
        if (fine < 0.025 || (coarse < 0.07 && fine < 0.5)) k = 0.15;
        var a = Math.min(255, depth * k) * cov / 255;
        for (var dy = 0; dy < step && y + dy < th; dy++) {
          for (var dx = 0; dx < step && x + dx < tw; dx++) {
            var di = ((y + dy) * tw + x + dx) * 4;
            dst[di] = op.gray; dst[di + 1] = op.gray; dst[di + 2] = op.gray; dst[di + 3] = a;
          }
        }
      }
    }
    tctx.putImageData(out, 0, 0);
    ctx.drawImage(tmp, op.x, op.y);
  }

  function grayStyle(v) { return 'rgb(' + v + ',' + v + ',' + v + ')'; }

  function paint(canvas, ops) {
    var ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textBaseline = 'alphabetic';
    ops.forEach(function (op) {
      if (op.t === 'rect') {
        ctx.fillStyle = grayStyle(op.gray);
        ctx.fillRect(op.x, op.y, op.w, op.h);
      } else if (op.grain) {
        paintGrain(ctx, op);
      } else {
        ctx.fillStyle = grayStyle(op.gray);
        ctx.font = fontFor(op.size, op.bold);
        ctx.fillText(op.s, op.x, op.y + op.size * 0.88);
      }
    });
  }

  // ===== 界面 =====
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('poster'), status = $('status');
  var last = { style: 'horizontal', W: 0, H: 0 };
  var ANCHORS = {
    center: ['center', 'center'], tl: ['top', 'left'], tr: ['top', 'right'],
    bl: ['bottom', 'left'], br: ['bottom', 'right']
  };

  // MDUI 文本框内部的 input / 清空按钮没有可访问名称，补上再交给读屏
  function labelFields() {
    Array.prototype.forEach.call(document.querySelectorAll('mdui-text-field'), function (field) {
      var root = field.shadowRoot;
      if (!root) return;
      var input = root.querySelector('input, textarea');
      if (input && !input.getAttribute('aria-label')) input.setAttribute('aria-label', field.label || '');
      var clear = root.querySelector('mdui-button-icon');
      var btn = clear && clear.shadowRoot && clear.shadowRoot.querySelector('button');
      if (btn && !btn.getAttribute('aria-label')) {
        btn.setAttribute('aria-label', '清空' + (field.label ? '：' + field.label : ''));
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('mdui-select'), function (field) {
      var trigger = field.shadowRoot && field.shadowRoot.querySelector('mdui-text-field');
      var input = trigger && trigger.shadowRoot && trigger.shadowRoot.querySelector('input');
      if (input && !input.getAttribute('aria-label')) input.setAttribute('aria-label', field.label || '');
    });
  }
  Promise.all([customElements.whenDefined('mdui-text-field'), customElements.whenDefined('mdui-select')])
    .then(function () {
      Array.prototype.forEach.call(document.querySelectorAll('mdui-text-field, mdui-select'), function (field) {
        if (field.updateComplete) field.updateComplete.then(labelFields);
      });
      setTimeout(labelFields, 300);
    });

  // 尺寸来源：Apple 官方技术规格、三星/小米官方规格页（2026-11）
  var SIZE_GROUPS = [
    { label: 'iPhone', bare: true, items: [
      ['iPhone 18 Pro Max', 1320, 2868],
      ['iPhone 18 Pro', 1206, 2622],
      ['iPhone 17 Pro Max', 1320, 2868],
      ['iPhone 17 Pro', 1206, 2622],
      ['iPhone 17', 1206, 2622],
      ['iPhone Air', 1260, 2736],
      ['iPhone 17e', 1170, 2532]
    ] },
    { label: 'Android', items: [
      ['三星 S26 Ultra', 1440, 3120],
      ['三星 S26+', 1440, 3120],
      ['三星 S26', 1080, 2340],
      ['小米 17 Ultra', 1200, 2608],
      ['小米 17', 1220, 2656],
      ['安卓 2K', 1440, 3200],
      ['安卓 1080p', 1080, 2400]
    ] },
    { label: '电脑', items: [
      ['桌面 1080p', 1920, 1080],
      ['桌面 1440p', 2560, 1440],
      ['宽屏 1440p', 3440, 1440],
      ['4K', 3840, 2160]
    ] }
  ];

  function ratioNum(W, H) {
    return Math.round((H >= W ? H / W * 9 : W / H * 9) * 100) / 100;
  }

  var sizeChoice = { w: 1320, h: 2868, custom: false };

  function sizeItemText(g, it) {
    return g.bare ? it[0] : it[0] + ' (' + it[1] + '×' + it[2] + ', ' + ratioNum(it[1], it[2]) + ':9)';
  }

  function clampSize(v, dflt) {
    return Math.max(320, Math.min(7680, +v || dflt));
  }

  function currentSize() {
    if (sizeChoice.custom) return [clampSize($('cw').value, 1170), clampSize($('ch').value, 2532)];
    return [sizeChoice.w, sizeChoice.h];
  }

  function updateRatio() {
    var s = currentSize();
    $('ratio').textContent = s[0] + ' × ' + s[1] + ' · 宽高比 ' + ratioNum(s[0], s[1]) + ' : 9';
  }

  (function buildSizes() {
    var sel = $('size'), items = [];
    SIZE_GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        var item = document.createElement('mdui-menu-item');
        item.setAttribute('value', String(items.length));
        item.textContent = sizeItemText(g, it);
        sel.appendChild(item);
        items.push({ w: it[1], h: it[2] });
      });
    });
    var custom = document.createElement('mdui-menu-item');
    custom.setAttribute('value', 'custom');
    custom.textContent = '自定义宽高';
    sel.appendChild(custom);
    sel.value = '0';
    sel.addEventListener('change', function () {
      if (sel.value === 'custom') sizeChoice = { custom: true };
      else {
        var it = items[+sel.value];
        sizeChoice = { w: it.w, h: it.h, custom: false };
      }
      $('customRow').hidden = !sizeChoice.custom;
      generate();
    });
  })();

  // ===== 版式卷轴 =====
  var STYLE_LABELS = [['random', '随机'], ['horizontal', '横排标题'], ['vertical', '竖排'],
    ['backdrop', '巨字铺底'], ['scatter', '散落关键词'], ['collage', '拼贴海报'], ['danxiangli', '单向历']];
  var styleChoice = 'horizontal';
  var THUMB = { w: 176, h: 381 };
  var THUMB_SAMPLE = '人生代代无穷已，江月年年望相似。';

  function scrollBehavior() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  }

  (function buildStyles() {
    var strip = $('styleStrip');
    STYLE_LABELS.forEach(function (it) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'style-card';
      card.setAttribute('data-style', it[0]);
      card.setAttribute('aria-pressed', it[0] === styleChoice ? 'true' : 'false');
      if (it[0] === 'random') {
        var glyph = document.createElement('div');
        glyph.className = 'thumb';
        glyph.textContent = '↻';
        glyph.setAttribute('aria-hidden', 'true');
        card.appendChild(glyph);
      } else {
        var cv = document.createElement('canvas');
        cv.width = THUMB.w; cv.height = THUMB.h;
        cv.setAttribute('aria-hidden', 'true');
        card.appendChild(cv);
      }
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = it[1];
      card.appendChild(name);
      card.addEventListener('click', function () { selectStyle(it[0]); });
      strip.appendChild(card);
    });
  })();

  function selectStyle(s) {
    styleChoice = s;
    Array.prototype.forEach.call(document.querySelectorAll('.style-card'), function (c) {
      c.setAttribute('aria-pressed', c.getAttribute('data-style') === s ? 'true' : 'false');
    });
    var strip = $('styleStrip'), sel = strip.querySelector('[aria-pressed="true"]');
    if (sel) strip.scrollTo({ left: sel.offsetLeft - (strip.clientWidth - sel.clientWidth) / 2, behavior: scrollBehavior() });
    generate();
  }

  // ===== 单向历的农历（勾选后联网）=====
  var lunarCache = { key: '', data: null, failed: false, busy: false };

  function lunarKey(d) {
    var mm = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function lunarFor(date) {
    if (!$('lunarOn').checked) return null;
    return lunarCache.key === lunarKey(date) ? lunarCache.data : null;
  }

  function maybeFetchLunar(style) {
    if (style !== 'danxiangli' || !$('lunarOn').checked) return;
    var key = lunarKey(new Date());
    if (lunarCache.key === key || lunarCache.busy) return;
    lunarCache = { key: key, data: null, failed: false, busy: true };
    fetch('https://api.530.news/api/lunar?date=' + key)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.code !== 200 || !j.data) throw new Error('bad payload');
        lunarCache = { key: key, data: dxLunarLines(j.data), failed: false, busy: false };
      })
      .catch(function () {
        lunarCache = { key: key, data: null, failed: true, busy: false };
      })
      .then(function () { if (styleChoice === 'danxiangli') generate(); });
  }

  function renderThumbs(text) {
    var q = {
      text: text.trim() ? text : THUMB_SAMPLE,
      title: $('title').value.trim(),
      author: $('author').value.trim(),
      keyword: $('keyword').value.trim()
    };
    var date = new Date(), lunar = lunarFor(date);
    Array.prototype.forEach.call(document.querySelectorAll('.style-card canvas'), function (cv) {
      var s = cv.parentNode.getAttribute('data-style');
      paint(cv, plan(s, q, THUMB.w, THUMB.h, { vpos: 'center', halign: 'center', date: date, lunar: lunar }).ops);
    });
  }

  (function wireArrows() {
    var strip = $('styleStrip');
    function sync() {
      $('stylePrev').disabled = strip.scrollLeft <= 0;
      $('styleNext').disabled = strip.scrollLeft >= strip.scrollWidth - strip.clientWidth - 1;
    }
    $('stylePrev').addEventListener('click', function () {
      strip.scrollBy({ left: -strip.clientWidth * 0.7, behavior: scrollBehavior() });
    });
    $('styleNext').addEventListener('click', function () {
      strip.scrollBy({ left: strip.clientWidth * 0.7, behavior: scrollBehavior() });
    });
    strip.addEventListener('scroll', sync);
    window.addEventListener('resize', sync);
    sync();
  })();



  function generate() {
    var text = $('text').value;
    var style = styleChoice;
    if (style === 'random') style = STYLES[Math.floor(Math.random() * STYLES.length)];
    $('lunarRow').hidden = style !== 'danxiangli';
    setLineChars($('lineChars').value);
    renderThumbs(text);
    labelFields();

    if (!text.trim() && style !== 'danxiangli') { status.textContent = '请输入一段文字'; return; }
    maybeFetchLunar(style);
    document.body.classList.add('busy');
    status.textContent = '生成中…';
    setTimeout(function () {
      var anchor = ANCHORS[$('pos').value];
      var now = new Date();
      var opts = { vpos: anchor[0], halign: anchor[1], date: now, lunar: lunarFor(now) };
      var size = currentSize(), W = size[0], H = size[1];
      updateRatio();
      var q = {
        text: text,
        title: $('title').value.trim(),
        author: $('author').value.trim(),
        keyword: $('keyword').value.trim()
      };
      canvas.width = W; canvas.height = H;

      var res = plan(style, q, W, H, opts);
      paint(canvas, res.ops);
      last = { style: res.style, W: W, H: H };
      $('pos').disabled = res.style === 'collage' || res.style === 'danxiangli';
      var lunarNote = res.style === 'danxiangli' && $('lunarOn').checked && lunarCache.failed ? ' · 农历获取失败' : '';
      status.textContent = res.style + ' · ' + W + ' × ' + H + lunarNote +
        (res.overflow ? ' · 文字过长，超出部分已截断' : '') + ' · 点击「下载 PNG」保存';
      var label = STYLE_LABELS.filter(function (it) { return it[0] === res.style; })[0];
      var chars = charsOf(text.trim());
      var alt = (label ? label[1] : res.style) + '海报，' + W + ' × ' + H + '。' +
        (chars.length ? chars.slice(0, 80).join('') + (chars.length > 80 ? '…' : '') : '内置每日一句');
      $('posterAlt').textContent = alt;
      $('previewDialog').setAttribute('aria-label', '海报预览：' + alt);
      document.body.classList.remove('busy');
    }, 20);
  }

  var timer = null;
  function later() {
    clearTimeout(timer);
    timer = setTimeout(generate, 350);
  }

  ['text', 'title', 'author', 'keyword', 'cw', 'ch', 'lineChars'].forEach(function (id) {
    $(id).addEventListener('input', later);
  });
  $('pos').addEventListener('change', generate);
  $('lunarOn').addEventListener('change', generate);

  $('save').addEventListener('click', function () {
    canvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'poster-' + last.style + '-' + last.W + 'x' + last.H + '.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      if (window.mdui) mdui.snackbar({ message: 'PNG 已开始下载' });
    }, 'image/png');
  });

  var previewBtn = $('previewBtn'), previewDialog = $('previewDialog');
  previewBtn.addEventListener('click', function () {
    previewDialog.insertBefore(canvas, $('previewClose'));
    previewDialog.showModal();
    $('previewClose').focus();
  });
  $('previewClose').addEventListener('click', function () { previewDialog.close(); });
  previewDialog.addEventListener('close', function () {
    previewBtn.appendChild(canvas);
    previewBtn.setAttribute('aria-expanded', 'false');
    previewBtn.focus();
  });

  generate();
})();
</script>
